name: Stage 2 Screener

on:
  schedule:
    - cron: '30 2 * * 6'   # Saturday 08:00 IST (02:30 UTC) - runs once a week, matching the weekly-chart strategy
  workflow_dispatch:        # lets you trigger it manually anytime from the repo's Actions tab

permissions:
  contents: write          # needed so this workflow can commit results back into the repo

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run India scan
        env:
          MARKET: IN
        run: python stage2_screener.py

      - name: Run US scan
        env:
          MARKET: US
        run: python stage2_screener.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --staged --quiet || git commit -m "Update screener results $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
