name: Stage 2 Screener - US

on:
  schedule:
    - cron: '30 19 * * 5'   # Saturday 01:00 IST (19:30 UTC Friday)
  workflow_dispatch:         # lets you trigger it manually anytime from the Actions tab

permissions:
  contents: write

jobs:
  scan-us:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run US scan
        env:
          MARKET: US
        run: python stage2_screener.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --staged --quiet || git commit -m "Update US screener results $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "Push attempt $i failed (another workflow likely pushed in the meantime) - retrying in 10s..."
            sleep 10
          done
