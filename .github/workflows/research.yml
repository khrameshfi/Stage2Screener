name: Stage 2 Winner Attribution (manual)

on:
  workflow_dispatch:
    inputs:
      years:
        description: "Years of signal history to analyse"
        required: false
        default: "9"
      min_mcap_cr:
        description: "Market cap floor, Rs crore"
        required: false
        default: "2000"
      rs_lookback:
        description: "Weeks since RS turned positive (2 = Loose, 1 = Strict)"
        required: false
        default: "2"
      require_vol_spike:
        description: "Also require the volume-spike condition (true/false)"
        required: false
        default: "false"
      limit:
        description: "Cap universe size for a quick test run (0 = full universe)"
        required: false
        default: "0"
      tag:
        description: "Suffix for output filenames"
        required: false
        default: "research"

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run attribution study
        run: |
          EXTRA=""
          if [ "${{ inputs.require_vol_spike }}" = "true" ]; then
            EXTRA="--require-vol-spike"
          fi
          python research_stage2.py \
            --years "${{ inputs.years }}" \
            --min-mcap-cr "${{ inputs.min_mcap_cr }}" \
            --rs-lookback "${{ inputs.rs_lookback }}" \
            --limit "${{ inputs.limit }}" \
            --tag "${{ inputs.tag }}" \
            $EXTRA

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/backtest/
          git diff --staged --quiet || git commit -m "Stage 2 attribution study: ${{ inputs.tag }} ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "Push attempt $i failed (another workflow likely pushed in the meantime) - retrying in 10s..."
            sleep 10
          done

      - name: Summary
        if: always()
        run: |
          if [ -f "output/backtest/research_${{ inputs.tag }}.md" ]; then
            cat "output/backtest/research_${{ inputs.tag }}.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report produced - check the run log above for errors." >> "$GITHUB_STEP_SUMMARY"
          fi
