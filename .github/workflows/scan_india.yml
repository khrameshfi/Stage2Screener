name: Stage 2 Screener - India

on:
  schedule:
    - cron: '30 5 * * 5'    # Friday 11:00 IST (05:30 UTC) - mid-day, week not yet closed
    - cron: '0 11 * * 5'    # Friday 16:30 IST (11:00 UTC) - after NSE close, final weekly data
  workflow_dispatch:         # lets you trigger it manually anytime from the Actions tab

permissions:
  contents: write

jobs:
  scan-india:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run India scan
        env:
          MARKET: IN
        run: python stage2_screener.py

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --staged --quiet || git commit -m "Update India screener results $(date -u +'%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "Push attempt $i failed (another workflow likely pushed in the meantime) - retrying in 10s..."
            sleep 10
          done
